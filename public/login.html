<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COMMUNITY 360 · Iniciar sesión</title>
  <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="pagina-login">
  <main class="tarjeta">
    <h1>Community<b>360</b></h1>
    <p class="sub">Panel de analítica de la comunidad</p>

    <form id="formulario" novalidate>
      <label for="usuario">Usuario o correo</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>

      <label for="password">Contraseña</label>
      <div class="campo-clave">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="ver" class="ver" aria-label="Mostrar u ocultar la contraseña">Ver</button>
      </div>

      <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>
      <button id="entrar" type="submit">Entrar</button>
    </form>

    <p class="pie">Acceso solo para usuarios autorizados</p>
  </main>
  <script src="/static/js/login.js"></script>
</body>
</html>
